name: Daily Yemen NewsGuard Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitoring
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          NEWSGUARD_SEARCH_MODEL: ${{ secrets.NEWSGUARD_SEARCH_MODEL }}
        run: python scripts/daily_monitor.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: yemen-newsguard-daily-report
          path: reports/*.json
          retention-days: 30
